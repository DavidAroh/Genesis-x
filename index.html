
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gemini Holographic Globe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <!-- MediaPipe Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
      body {
        margin: 0;
        background-color: #050505;
        color: #e3e3e3;
        overflow: hidden;
        font-family: 'Roboto', sans-serif;
      }
      .font-orbitron { font-family: 'Orbitron', sans-serif; }
      canvas {
        transform: scaleX(-1);
      }
      #three-canvas {
        transform: none; /* 3D layer shouldn't be mirrored or it messes up logic */
      }
      .scanline {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: rgba(0, 255, 255, 0.1);
        z-index: 100;
        pointer-events: none;
        animation: scan 4s linear infinite;
      }
      @keyframes scan {
        from { top: -2px; }
        to { top: 100%; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",

    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

</head>
